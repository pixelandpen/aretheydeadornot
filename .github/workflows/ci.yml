name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  dotnet-test:
    name: .NET Build & xUnit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore AreTheyDeadOrNot.sln
      - run: dotnet build AreTheyDeadOrNot.sln --configuration Release --no-restore
      - run: dotnet test AreTheyDeadOrNot.sln --configuration Release --no-build --verbosity normal

  web-build:
    name: React Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build

  terraform-validate:
    name: Terraform Fmt & Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.0'
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
