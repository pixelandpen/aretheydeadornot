services:
  postgres-primary:
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "work_mem=4MB"
    ports: !reset []

  postgres-replica:
    profiles: ["full"]

  redis:
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports: !reset []

  api-1:
    depends_on: !override
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ConnectionStrings__PostgresReadReplica: Host=postgres-primary;Port=5432;Database=celebrities;Username=postgres;Password=postgres_password;Maximum Pool Size=25
      ConnectionStrings__PostgresPrimary: Host=postgres-primary;Port=5432;Database=celebrities;Username=postgres;Password=postgres_password;Maximum Pool Size=10

  api-2:
    profiles: ["full"]

  web:
    build:
      args:
        VITE_BASE_PATH: /aretheydeadornot/

  lb:
    depends_on: !override
      - api-1
      - web
    volumes: !override
      - ./nginx/lb-droplet.conf:/etc/nginx/conf.d/default.conf:ro
    ports: !override
      - "127.0.0.1:8085:80"

  prometheus:
    profiles: ["full"]

  grafana:
    profiles: ["full"]
